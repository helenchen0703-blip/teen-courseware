<title>Teen 话语课件</title>
<style>
:root{--night:#1d1530;--gold:#e9b44c;--paper:#fbf5e8;--ink:#3a2c1c;--muted:#8a7660}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#3b2b5c 0%,var(--night) 60%) fixed;color:#fff;font:16px/1.6 "Noto Sans SC","PingFang SC",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:520px;text-align:center}
h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(28px,5vw,44px);margin-bottom:6px}
h1 span{color:var(--gold)}
.sub{color:#c9b8e8;font-size:15px;margin-bottom:28px}
.card{background:var(--paper);border-radius:18px;padding:24px;box-shadow:0 8px 0 rgba(0,0,0,.2);text-align:left;color:var(--ink);margin-bottom:20px}
.card h2{font-family:"Noto Serif SC",serif;font-size:22px;margin-bottom:6px}
.card p{color:var(--muted);font-size:14px;margin-bottom:16px}
.btn{display:inline-block;background:var(--gold);color:var(--ink);font-weight:700;font-size:18px;border-radius:12px;padding:12px 28px;text-decoration:none;box-shadow:0 4px 0 #c89a2e;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.date{font-size:13px;color:var(--muted);margin-top:12px}
</style>
</head>
